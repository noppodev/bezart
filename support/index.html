<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support - Bezart</title>
  <meta name="description" content="Bezartサポートとお問い合わせ">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="navbar-container"></div>

  <main class="main-content">
    <section class="page-header">
      <div class="header-container">
        <h1 class="page-title">Support</h1>
        <p class="page-subtitle">サポートとお問い合わせ</p>
      </div>
    </section>

    <section class="content-section">
      <div class="content-container">
        <div class="support-grid">
          <div class="support-card">
            <h2>ドキュメント</h2>
            <p>詳細な使用方法はドキュメントをご確認ください</p>
            <a href="/docs/" class="btn btn-secondary">ドキュメントを見る</a>
          </div>

          <div class="support-card">
            <h2>お問い合わせ</h2>
            <p>ご不明な点はお気軽にお問い合わせください</p>
            <a href="mailto:bezart@f5.si" class="btn btn-secondary">メールで問い合わせ</a>
          </div>

          <div class="support-card">
            <h2>FAQ</h2>
            <p>よくある質問と回答</p>
            <a href="#" class="btn btn-secondary">FAQを見る</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="../js/navbar.js"></script>
  <script src="../js/search.js"></script>
</body>
</html>
