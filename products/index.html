<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - Bezart</title>
  <meta name="description" content="Bezart製品ラインナップ">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="navbar-container"></div>

  <main class="main-content">
    <section class="page-header">
      <div class="header-container">
        <h1 class="page-title">Products</h1>
        <p class="page-subtitle">音楽活動を前へ進めるBezartのプロダクト</p>
      </div>
    </section>

    <section class="products-content">
      <div class="products-container">
        <div class="products-grid">
          <a href="/products/flow/" class="product-card">
            <div class="product-badge">WORKSPACE</div>
            <h2 class="product-title">Bezart Flow</h2>
            <p class="product-description">音楽活動を、次のアクションから再開するデスクトップ・ワークスペース</p>
            <div class="product-price">詳細を見る</div>
          </a>
        </div>
      </div>
    </section>
  </main>

  <script src="../js/navbar.js"></script>
  <script src="../js/search.js"></script>
</body>
</html>
